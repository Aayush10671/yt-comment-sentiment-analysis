stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
      - src/data/data_ingestion.py
    params:
      - data_ingestion.test_size
    outs:
      - data/raw

  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
      - src/data/data_preprocessing.py
      - data/raw/train.csv
      - data/raw/test.csv
    outs:
      - data/interim

  model_building:
    cmd: python src/models/model_building.py
    deps:
      - src/models/model_building.py
      - data/interim/train_processed.csv
    params:
      - feature_engineering.max_features
      - feature_engineering.ngram_range
      - model_building.learning_rate
      - model_building.max_depth
      - model_building.n_estimators
    outs:
      - models/lgbm_model.pkl
      - models/tfidf_vectorizer.pkl

  model_evaluation:
    cmd: python src/models/model_evaluatio.py
    deps:
      - src/models/model_evaluatio.py
      - data/interim/test_processed.csv
      - models/lgbm_model.pkl
      - models/tfidf_vectorizer.pkl
    params:
      - mlflow.tracking_uri
      - mlflow.experiment_name
    outs:
      - experiment_info.json

  model_registration:
    cmd: python src/models/register_model.py
    deps:
      - src/models/register_model.py
      - experiment_info.json
    params:
      - mlflow.tracking_uri